[project]
name = "turbopaster"
version = "0.1.0"
description = "Local hotkey launcher that inserts saved text snippets"
readme = "README.md"
authors = [
    { name = "Dohny42", email = "dohny42@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pynput>=1.8.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
turbopaster = "turbopaster.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
